name: Publish

# Publishes to the PowerShell Gallery when a version tag (v0.1.0, ...) is pushed.
# Requires the repository secret PSGALLERY_API_KEY.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile src/PSGnuUtils/PSGnuUtils.psd1).ModuleVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match ModuleVersion $version" }
      - name: Bootstrap
        shell: pwsh
        run: ./build.ps1 -Task Bootstrap
      - name: Analyze, test, build, test build
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test, Build, TestBuild
      - name: Publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./build.ps1 -Task Publish
